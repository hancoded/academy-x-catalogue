<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academy X Outputs Catalogue</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'IBM Plex Sans', sans-serif; }
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8); display: flex; align-items: center;
            justify-content: center; z-index: 1000; backdrop-filter: blur(5px);
        }
        .modal-content {
            background: white; border-radius: 16px; overflow: hidden;
            max-width: 90vw; max-height: 90vh; width: 800px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.3);
        }
        .page-nav {
            background: linear-gradient(135deg, #14243F, #00112F);
            color: white; padding: 1rem 2rem; display: flex;
            align-items: center; justify-content: space-between;
        }
        .image-container {
            min-height: 500px; display: flex; align-items: center;
            justify-content: center; background: #f8f9fa; padding: 2rem;
        }
        .image-container img {
            max-width: 100%; max-height: 400px; border-radius: 8px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        .card {
            background: white; border: 1px solid #e0e0e0; border-radius: 12px;
            padding: 1.5rem; cursor: pointer; transition: all 0.2s;
        }
        .card:hover {
            transform: translateY(-4px); box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            border-color: #7B28A2;
        }
        .project-header {
            height: 120px; border-radius: 8px; display: flex;
            align-items: center; justify-content: center; color: white;
            margin-bottom: 1rem; position: relative; overflow: hidden;
        }
        .project-overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.2); display: flex; align-items: center;
            justify-content: center; opacity: 0; transition: opacity 0.2s;
            color: white; font-size: 0.9rem; font-weight: bold;
        }
        .project-header:hover .project-overlay { opacity: 1; }
        .btn {
            padding: 0.5rem 1rem; border-radius: 6px; border: none;
            cursor: pointer; font-weight: bold; transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .btn-primary { background: #7B28A2; color: white; }
        .btn-outline { background: transparent; border: 1px solid white; color: white; }
        .btn-outline.active { background: white; color: #14243F; }
        .grid { display: grid; gap: 2rem; }
        .grid-3 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
        .grid-stats { grid-template-columns: repeat(3, 1fr); max-width: 500px; margin: 2rem auto 0; }
        .text-center { text-align: center; }
        .page-dot {
            width: 8px; height: 8px; border-radius: 50%; cursor: pointer;
            transition: all 0.2s; margin: 0 0.25rem;
        }
        .page-dot.active { background: #7B28A2; transform: scale(1.2); }
        .page-dot:not(.active) { background: rgba(255,255,255,0.3); }
    </style>
</head>
<body>
    <div id="root"></div>

                                        background: '#f5f5f5', padding: '1rem', borderRadius: '8px',

                                    }}>

                                        }}>

                                </div>

</body>
</html>
